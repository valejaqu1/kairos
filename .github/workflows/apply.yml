name: apply
on:
  push:
    branches: [main]
    paths: ["decisions/**"]
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: kairos-state
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verrou du code
        env:
          KAIROS_CODE_FINGERPRINT: ${{ vars.KAIROS_CODE_FINGERPRINT }}
        run: |
          actual=$(git ls-tree -r --full-tree HEAD | awk -F'\t' '$2 !~ /^"?(state|decisions|journal|memory|site|data\/odds|data\/model)\//' | sha256sum | cut -d' ' -f1)
          if [ -z "${KAIROS_CODE_FINGERPRINT:-}" ] || [ "$actual" != "$KAIROS_CODE_FINGERPRINT" ]; then
            echo "Code non validé : empreinte $actual, attendue ${KAIROS_CODE_FINGERPRINT:-(vide)}"
            exit 1
          fi
          pages=$(git ls-files site)
          extra=$(printf '%s\n' "$pages" | grep -vxF -e site/index.html -e site/data.json || true)
          if [ -n "$extra" ]; then
            echo "Code non validé : site/ ne doit contenir que index.html et data.json, trouvé : $(printf '%s' "$extra" | tr '\n' ' ')"
            exit 1
          fi
          if [ -e site/index.html ] && ! cmp -s site/index.html site_template/index.html; then
            echo "Page non conforme au gabarit"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m kairos.cli apply
        env:
          PYTHONSAFEPATH: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://valejaqu1.github.io/kairos/
      - name: Commit
        run: |
          git config user.name "kairos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "apply: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
  deploy:
    needs: apply
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
