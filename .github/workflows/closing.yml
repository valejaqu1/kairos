name: closing
on:
  schedule:
    - cron: "*/30 7-21 * * *"
  workflow_dispatch: {}
concurrency:
  group: kairos-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m kairos.cli closing
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit
        run: |
          git config user.name "kairos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "closing: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
