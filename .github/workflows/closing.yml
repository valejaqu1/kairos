name: closing
on:
  schedule:
    - cron: "7,37 7-21 * * *"
  workflow_dispatch: {}
concurrency:
  group: kairos-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verrou du code
        env:
          KAIROS_CODE_FINGERPRINT: ${{ vars.KAIROS_CODE_FINGERPRINT }}
        run: |
          actual=$(git ls-tree -r HEAD -- kairos site_template pyproject.toml .github ROUTINE.md .claude data/team_aliases.json | sha256sum | cut -d' ' -f1)
          if [ -z "${KAIROS_CODE_FINGERPRINT:-}" ] || [ "$actual" != "$KAIROS_CODE_FINGERPRINT" ]; then
            echo "Code non validé : empreinte $actual, attendue ${KAIROS_CODE_FINGERPRINT:-(vide)}"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m kairos.cli closing
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit
        run: |
          git config user.name "kairos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "closing: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
