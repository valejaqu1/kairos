name: tests
on:
  push:
    branches: [main]
    paths: ["kairos/**", "tests/**", "site_template/**", "pyproject.toml", ".github/workflows/**"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
