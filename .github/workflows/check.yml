name: check-api
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m kairos.cli check-api >> "$GITHUB_STEP_SUMMARY"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
